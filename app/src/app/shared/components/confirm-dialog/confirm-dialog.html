<div class="confirm-dialog">
  <div class="confirm-icon" [class.danger]="data.danger">
    <mat-icon>{{ data.icon || 'help_outline' }}</mat-icon>
  </div>

  <h2 mat-dialog-title>{{ data.title }}</h2>

  <mat-dialog-content>
    <p>{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button (click)="cancelar()">
      {{ data.cancelLabel || 'Cancelar' }}
    </button>

    <button mat-flat-button [color]="data.danger ? 'warn' : 'primary'" (click)="confirmar()">
      {{ data.confirmLabel || 'Confirmar' }}
    </button>
  </mat-dialog-actions>
</div>
